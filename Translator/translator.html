<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Between Words — Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0E1626;
    --panel: #172038;
    --panel-2: #1D2A48;
    --line: #2C3A5C;
    --paper: #EDE7D9;
    --paper-dim: #B9B4A6;
    --brass: #C9A227;
    --brass-bright: #E4C34C;
    --teal: #4FB3A9;
    --coral: #E1725C;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 60px;
    position: relative;
    overflow-x: hidden;
  }

  /* subtle multilingual glyph texture in background */
  .glyphs{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .glyphs span{
    position: absolute;
    font-family: 'Fraunces', serif;
    color: var(--paper);
    opacity: 0.035;
    font-size: 90px;
    user-select: none;
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: 920px;
    margin: 0 auto;
  }

  header{
    text-align: center;
    margin-bottom: 38px;
  }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 14px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(34px, 6vw, 54px);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .sub{
    color: var(--paper-dim);
    font-size: 15px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.5;
  }

  .board{
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 18px;
    align-items: stretch;
  }

  @media (max-width: 720px){
    .board{ grid-template-columns: 1fr; }
    .swap-col{ order: 2; }
    .target-col{ order: 3; }
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    min-height: 320px;
    position: relative;
    overflow: hidden;
  }

  .panel::before{
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height: 3px;
  }
  .source-col .panel::before{ background: var(--teal); }
  .target-col .panel::before{ background: var(--brass); }

  .panel-head{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }

  select{
    background: transparent;
    color: var(--paper);
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 6px 4px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }
  select:focus-visible, button:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }
  select option{ background: var(--panel-2); color: var(--paper); }

  .lang-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--paper-dim);
  }

  textarea{
    flex: 1;
    background: transparent;
    border: none;
    resize: none;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 16px;
    min-height: 200px;
  }
  textarea::placeholder{ color: var(--paper-dim); opacity: 0.6; }

  .result{
    flex: 1;
    padding: 16px;
    font-size: 17px;
    line-height: 1.5;
    color: var(--paper);
    min-height: 200px;
    white-space: pre-wrap;
  }
  .result.placeholder{ color: var(--paper-dim); opacity: 0.6; font-style: italic; }

  .panel-foot{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px 12px;
    border-top: 1px solid var(--line);
  }

  .count{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--paper-dim);
  }

  .icon-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--paper-dim);
    border-radius: 3px;
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    margin-left: 6px;
  }
  .icon-btn:hover{ border-color: var(--brass); color: var(--brass-bright); }
  .icon-btn svg{ width: 15px; height: 15px; }
  .icon-btn.copied{ border-color: var(--teal); color: var(--teal); }

  .swap-col{
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .swap-btn{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--brass-bright);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .2s ease, border-color .15s;
  }
  .swap-btn:hover{ border-color: var(--brass); transform: rotate(180deg); }
  .swap-btn svg{ width: 20px; height: 20px; }

  .actions{
    display: flex;
    justify-content: center;
    margin-top: 28px;
  }

  .translate-btn{
    background: var(--brass);
    color: var(--ink);
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 14px 38px;
    border-radius: 3px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .translate-btn:hover{ background: var(--brass-bright); }
  .translate-btn:active{ transform: scale(0.98); }
  .translate-btn:disabled{ background: var(--line); color: var(--paper-dim); cursor: not-allowed; }

  .status{
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--coral);
    min-height: 18px;
    margin-top: 14px;
  }

  .bridge-note{
    text-align: center;
    margin-top: 44px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--paper-dim);
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="glyphs" aria-hidden="true">
  <span style="top:5%; left:8%;">文</span>
  <span style="top:60%; left:4%; font-size:70px;">あ</span>
  <span style="top:15%; right:6%; font-size:110px;">ñ</span>
  <span style="bottom:8%; right:10%; font-size:80px;">ह</span>
  <span style="bottom:20%; left:38%; font-size:60px;">ع</span>
  <span style="top:40%; right:30%; font-size:65px;">é</span>
</div>

<div class="wrap">
  <header>
    <div class="eyebrow">Language Bridge</div>
    <h1>Between Words</h1>
    <p class="sub">Write in one language. Read it in another. Nothing lost in the crossing but time.</p>
  </header>

  <div class="board">
    <div class="source-col">
      <div class="panel">
        <div class="panel-head">
          <span class="lang-label">From</span>
          <select id="sourceLang" aria-label="Source language"></select>
        </div>
        <textarea id="sourceText" placeholder="Start typing…" maxlength="1000"></textarea>
        <div class="panel-foot">
          <span class="count"><span id="charCount">0</span>/1000</span>
          <div>
            <button class="icon-btn" id="speakSource" title="Listen to source text" aria-label="Listen to source text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M19 12a7 7 0 0 0-3-5.7M16.5 9.5A3.5 3.5 0 0 1 18 12"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="swap-col">
      <button class="swap-btn" id="swapBtn" title="Swap languages" aria-label="Swap languages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3 3 7l4 4"/><path d="M3 7h13a4 4 0 0 1 4 4"/><path d="m17 21 4-4-4-4"/><path d="M21 17H8a4 4 0 0 1-4-4"/></svg>
      </button>
    </div>

    <div class="target-col">
      <div class="panel">
        <div class="panel-head">
          <span class="lang-label">Into</span>
          <select id="targetLang" aria-label="Target language"></select>
        </div>
        <div class="result placeholder" id="resultText">Your translation will appear here.</div>
        <div class="panel-foot">
          <span class="count" id="targetStatus"></span>
          <div>
            <button class="icon-btn" id="speakTarget" title="Listen to translation" aria-label="Listen to translation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M19 12a7 7 0 0 0-3-5.7M16.5 9.5A3.5 3.5 0 0 1 18 12"/></svg>
            </button>
            <button class="icon-btn" id="copyBtn" title="Copy translation" aria-label="Copy translation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="1"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="translate-btn" id="translateBtn">Translate</button>
  </div>
  <div class="status" id="statusMsg"></div>

  <div class="bridge-note">Google Translate · Web Speech API</div>
</div>

<script>
  const LANGUAGES = [
    ["en","English","en-US"],["es","Spanish","es-ES"],["fr","French","fr-FR"],
    ["de","German","de-DE"],["it","Italian","it-IT"],["pt","Portuguese","pt-PT"],
    ["ru","Russian","ru-RU"],["zh-CN","Chinese (Simplified)","zh-CN"],["ja","Japanese","ja-JP"],
    ["ko","Korean","ko-KR"],["ar","Arabic","ar-SA"],["hi","Hindi","hi-IN"],
    ["te","Telugu","te-IN"],["ta","Tamil","ta-IN"],["bn","Bengali","bn-IN"],
    ["ur","Urdu","ur-PK"],["nl","Dutch","nl-NL"],["sv","Swedish","sv-SE"],
    ["pl","Polish","pl-PL"],["tr","Turkish","tr-TR"],["vi","Vietnamese","vi-VN"],
    ["th","Thai","th-TH"],["el","Greek","el-GR"],["he","Hebrew","he-IL"],
    ["id","Indonesian","id-ID"]
  ];

  const sourceSel = document.getElementById('sourceLang');
  const targetSel = document.getElementById('targetLang');
  const sourceText = document.getElementById('sourceText');
  const resultText = document.getElementById('resultText');
  const charCount = document.getElementById('charCount');
  const targetStatus = document.getElementById('targetStatus');
  const statusMsg = document.getElementById('statusMsg');
  const translateBtn = document.getElementById('translateBtn');
  const copyBtn = document.getElementById('copyBtn');
  const swapBtn = document.getElementById('swapBtn');
  const speakSourceBtn = document.getElementById('speakSource');
  const speakTargetBtn = document.getElementById('speakTarget');

  function fillSelect(sel, defaultCode){
    LANGUAGES.forEach(([code, name]) => {
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = name;
      if(code === defaultCode) opt.selected = true;
      sel.appendChild(opt);
    });
  }
  fillSelect(sourceSel, 'en');
  fillSelect(targetSel, 'es');

  function langMeta(code){
    return LANGUAGES.find(l => l[0] === code);
  }

  sourceText.addEventListener('input', () => {
    charCount.textContent = sourceText.value.length;
  });

  async function translate(){
    const text = sourceText.value.trim();
    if(!text){
      statusMsg.textContent = 'Type something to translate first.';
      return;
    }
    const src = sourceSel.value;
    const tgt = targetSel.value;
    if(src === tgt){
      resultText.textContent = text;
      resultText.classList.remove('placeholder');
      targetStatus.textContent = 'same language';
      return;
    }

    statusMsg.textContent = '';
    translateBtn.disabled = true;
    translateBtn.textContent = 'Translating…';
    targetStatus.textContent = '';

    try{
      let translated;
      try{
        translated = await translateViaGoogle(text, src, tgt);
      }catch(googleErr){
        translated = await translateViaMyMemory(text, src, tgt);
      }

      resultText.textContent = translated;
      resultText.classList.remove('placeholder');
      targetStatus.textContent = `${langMeta(tgt)[1]}`;
    }catch(err){
      statusMsg.textContent = err.message && err.message.length < 120
        ? err.message
        : 'Translation failed — check your connection and try again.';
    }finally{
      translateBtn.disabled = false;
      translateBtn.textContent = 'Translate';
    }
  }

  // Primary: Google's public translation endpoint. No key, generally much
  // higher quality and correct native script than MyMemory's crowd-sourced
  // memory, especially for less common language pairs.
  async function translateViaGoogle(text, src, tgt){
    const googleSrc = src.split('-')[0];
    const googleTgt = tgt.split('-')[0];
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${googleSrc}&tl=${googleTgt}&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Google endpoint request failed');
    const data = await res.json();
    const segments = data?.[0];
    if(!Array.isArray(segments) || segments.length === 0) throw new Error('No translation returned');
    const translated = segments.map(seg => seg[0]).join('');
    if(!translated) throw new Error('No translation returned');
    return translated;
  }

  // Fallback: MyMemory, used only if the Google endpoint is unreachable.
  async function translateViaMyMemory(text, src, tgt){
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|${tgt}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Request failed');
    const data = await res.json();

    if(data.responseStatus && Number(data.responseStatus) !== 200){
      throw new Error(data.responseDetails || 'Translation failed');
    }

    const translated = data?.responseData?.translatedText;
    if(!translated) throw new Error('No translation returned');

    const looksLikeError = /INVALID (SOURCE|TARGET) LANGUAGE|QUERY LENGTH LIMIT|MYMEMORY WARNING|AMBIGUOUS/i.test(translated);
    if(looksLikeError) throw new Error(translated);

    return translated;
  }

  translateBtn.addEventListener('click', translate);

  sourceText.addEventListener('keydown', (e) => {
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
      translate();
    }
  });

  swapBtn.addEventListener('click', () => {
    const s = sourceSel.value;
    const t = targetSel.value;
    sourceSel.value = t;
    targetSel.value = s;
    const currentResult = resultText.classList.contains('placeholder') ? '' : resultText.textContent;
    if(currentResult){
      sourceText.value = currentResult;
      charCount.textContent = sourceText.value.length;
      resultText.textContent = 'Your translation will appear here.';
      resultText.classList.add('placeholder');
      targetStatus.textContent = '';
    }
  });

  copyBtn.addEventListener('click', async () => {
    const text = resultText.classList.contains('placeholder') ? '' : resultText.textContent;
    if(!text) return;
    try{
      await navigator.clipboard.writeText(text);
      copyBtn.classList.add('copied');
      setTimeout(() => copyBtn.classList.remove('copied'), 1400);
    }catch(err){
      statusMsg.textContent = 'Could not copy — select and copy manually.';
    }
  });

  function speak(text, langCode){
    if(!text) return;
    if(!('speechSynthesis' in window)){
      statusMsg.textContent = 'Text-to-speech is not supported in this browser.';
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const meta = langMeta(langCode);
    if(meta) utter.lang = meta[2];
    window.speechSynthesis.speak(utter);
  }

  speakSourceBtn.addEventListener('click', () => {
    speak(sourceText.value.trim(), sourceSel.value);
  });

  speakTargetBtn.addEventListener('click', () => {
    const text = resultText.classList.contains('placeholder') ? '' : resultText.textContent;
    speak(text, targetSel.value);
  });
</script>

</body>
</html>
