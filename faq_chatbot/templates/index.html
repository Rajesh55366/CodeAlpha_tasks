<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northbound Bikes — Help Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="shop-plate">
  <div class="plate-inner">
    <div class="plate-mark">
      <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
        <circle cx="10" cy="28" r="7" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="30" cy="28" r="7" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M10 28 L18 12 L26 28 M18 12 L24 12 M14 20 L26 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="plate-text">
      <span class="plate-title">Northbound Bikes</span>
      <span class="plate-sub">Help Desk — ask us anything</span>
    </div>
    <div class="plate-status"><span class="dot"></span>Counter open</div>
  </div>
</div>

<main class="chat-shell">
  <div id="log" class="log" aria-live="polite">
    <div class="msg bot">
      <div class="bubble">
        Welcome in. I'm the shop's FAQ desk — ask about repairs, rentals, sizing, warranties, or hours.
      </div>
    </div>
  </div>

  <div id="chips" class="chips"></div>

  <form id="composer" class="composer" autocomplete="off">
    <input id="input" type="text" placeholder="Ask a question…" aria-label="Type your question" />
    <button type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 11L21 3L13 21L11 13L3 11Z" fill="currentColor"/></svg>
    </button>
  </form>
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
